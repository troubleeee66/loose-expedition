function initials(name){
  // 괄호 앞부분만, 한 글자
  const clean = name.replace(/\(.*\)/,'').trim();
  return clean.slice(-1);
}

function renderTagFilters(){
  const allTags = [...new Set(people.flatMap(p=>p.tags))];
  const wrap = document.getElementById('tagFilters');
  if(!wrap) return;
  wrap.innerHTML = allTags.map(t=>`<span class="tag-chip ${state.activeTag===t?'active':''}" data-tag="${t}">${t}</span>`).join('');
  wrap.querySelectorAll('.tag-chip').forEach(el=>{
    el.addEventListener('click',()=>{
      state.activeTag = state.activeTag === el.dataset.tag ? null : el.dataset.tag;
      renderAll();
    });
  });
}

function renderPersonList(){
  const wrap = document.getElementById('personList');
  const q = state.query.trim().toLowerCase();
  const filtered = people.filter(p=>{
    const tagOk = !state.activeTag || p.tags.includes(state.activeTag);
    const qOk = !q || p.name.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q) ||
      p.tags.join(' ').toLowerCase().includes(q) ||
      (p.quotes||[]).some(qt=>qt.text.toLowerCase().includes(q));
    return tagOk && qOk;
  });
  wrap.innerHTML = filtered.map(p=>`
    <div class="person-item ${state.activePerson===p.id?'active':''}" data-id="${p.id}">
      <div class="person-avatar">${initials(p.name)}</div>
      <div class="person-meta">
        <div class="person-name">${p.name}<span class="spoon">🥄</span></div>
        <div class="person-sub">${p.tags.join(' · ')}</div>
      </div>
    </div>
  `).join('') || `<div style="font-size:12.5px;color:var(--ink-faint);padding:10px 4px;">검색 결과가 없습니다.</div>`;

  wrap.querySelectorAll('.person-item').forEach(el=>{
    el.addEventListener('click',()=>{
      state.activePerson = el.dataset.id;
      state.view = 'person';
      renderAll();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

/* ============ RENDER: MAIN CONTENT ============ */
function renderPersonView(){
  const p = people.find(x=>x.id===state.activePerson) || people[0];
  const causeRows = p.causes.map(c=>`<tr><td class="label">${c.label}</td><td>${c.detail}</td></tr>`).join('');
  const entries = transcripts[p.id] || [];
  const q = state.query.trim().toLowerCase();
  const filteredEntries = q ? entries.filter(e=>e.text.toLowerCase().includes(q)) : entries;
  const transcriptHtml = entries.length ? `
    <div class="section">
      <h3>전체 발화 내용</h3>
      <div class="meta-line" style="margin-bottom:14px;">클로바노트 STT 기반 정리본 · 결의 질문은 "Q."로 표시</div>
      ${q && filteredEntries.length===0 ? `<div style="font-size:13px;color:var(--ink-faint);">"${state.query}"에 대한 검색 결과가 없습니다.</div>` : ''}
      <div class="transcript">
        ${filteredEntries.map(e=>{
          const isInterviewer = e.who === '결';
          const cls = isInterviewer ? 'from-interviewer' : 'from-interviewee';
          const paragraphs = e.text.split(/\n\n+/).map(t=>`<p>${t.replace(/\n/g,'<br>')}</p>`).join('');
          return `
          <div class="t-turn ${cls}">
            <div class="t-who" style="${isInterviewer?'':`color:${p.color}`}">${e.who}</div>
            <div class="t-bubble">${paragraphs}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  return `
    <div class="person-header">
      <div class="eyebrow">인터뷰</div>
      <h2>${p.name}</h2>
      <div class="meta-line">${p.dateLoc}</div>
      <div class="person-tags">${p.tags.map(t=>`<span class="badge">${t}</span>`).join('')}</div>
    </div>

    <div class="insight-list" style="margin-bottom:36px"><li>${p.summary}</li></div>

    ${p.quotes && p.quotes.length ? `
    <div style="margin-bottom:40px">
      ${p.quotes.map(q=>`<div class="quote-block">“${q.text}”<span class="note">${q.note}</span></div>`).join('')}
    </div>` : ''}

    ${p.note ? `<div class="note-box" style="margin-bottom:28px;">⚠ ${p.note}</div>` : ''}


    <div class="section">
      <h3>활동 타임라인</h3>
      <div class="timeline">
        ${p.timeline.map(t=>`<div class="timeline-item">${t}</div>`).join('')}
      </div>
    </div>


    ${transcriptHtml}

    <div class="section">
      <h3>핵심 인사이트</h3>
      <ul class="insight-list">
        ${p.insights.map(i=>`<li>${i}</li>`).join('')}
      </ul>
    </div>

    <div class="section">
      <h3>이탈 구조 원인</h3>
      <table class="cause-table">
        <thead><tr><th>원인</th><th>내용</th></tr></thead>
        <tbody>${causeRows}</tbody>
      </table>
    </div>

    <div class="section">
      <h3>재참여 조건</h3>
      <div class="chip-list">
        ${p.reengage.map(r=>`<div class="chip">${r}</div>`).join('')}
      </div>
    </div>
  `;
}

function renderOverviewView(){
  return `
    <div class="person-header">
      <div class="eyebrow">프로젝트 개요</div>
      <h2>다시 숟가락 얹기</h2>
      <div class="meta-line">공익 활동 이탈자의 느슨한 재참여 유도 프로젝트</div>
      <div class="person-tags">
        <span class="badge lav">활동기간 2026.04~10</span>
        <span class="badge lav">예산 3,000,000원</span>
      </div>
    </div>

    <div class="section">
      <h3>해결하려는 문제</h3>
      <div class="insight-list">
        <li>공익활동을 떠난 사람들 중 상당수는 "완전히 이탈했다"는 미안함과 부채감을 안고 있지만, 다시 닿을 수 있는 통로는 마땅치 않다.</li>
        <li>인터뷰를 거듭할수록 이는 개인의 의지나 열정의 문제라기보다 <b>조직 구조의 문제</b>에 가깝다는 점이 드러났다. "전부 아니면 전무"의 참여 방식, 온보딩·인수인계의 부재, 문제 제기가 막히는 피드백 문화가 반복해서 확인된다.</li>
        <li>그래서 질문을 "이탈한 사람을 어떻게 돌아오게 할까"에서 <b>"조직이 어떻게 사람을 덜 소진시키고 느슨하게 붙들 수 있을까"</b>로 넓혔다.</li>
      </div>
    </div>

    <div class="section">
      <h3>접근 — Unpacking &amp; Repacking</h3>
      <div class="insight-list">
        <li><b>① Unpacking (경험의 해체)</b> — 설문(33명)과 대면 인터뷰(9명)로 이탈 경험을 기록하고, 이를 개인의 실패나 번아웃이 아니라 활동을 이어가기 어려웠던 조건과 구조로 읽어낸다.</li>
        <li><b>② Repacking (참여의 재구성)</b> — 새 모임을 만드는 대신, 이미 작동 중인 느슨한 참여 사례와 재참여 조건을 정리하고, 조직이 스스로 점검할 수 있는 자가진단 체크리스트로 다시 묶는다.</li>
        <li><b>③ 조심스러운 환류</b> — 인터뷰이 상당수가 단체 활동 경험자이고 각자의 상처가 있어, 집단 모임(라운드테이블) 대신 개별 서면 환류와 비식별 공개 아카이브를 택했다.</li>
      </div>
    </div>

    <div class="section">
      <h3>차별점</h3>
      <ul class="insight-list">
        <li><b>관점의 전환</b> — 이탈을 개인의 "실패"가 아니라 조직 구조가 보내는 신호이자 다음 시도를 위한 숙성의 시간으로 읽는다.</li>
        <li><b>질문 대상의 확장</b> — 떠난 사람에게만 묻지 않고, 사람을 소진시키는 조직의 조건을 함께 드러낸다.</li>
        <li><b>돌봄의 방식</b> — 당사자의 상처를 고려해 집단 모임 대신 개별 인터뷰·서면 환류를 택하고, 공개 자료는 모두 비식별 처리한다.</li>
        <li><b>쓸 수 있는 도구</b> — 분석에서 멈추지 않고 조직용 자가진단 체크리스트와 재참여 조건 정리로 연결한다.</li>
      </ul>
    </div>

    <div class="section">
      <h3>기대 변화</h3>
      <ul class="insight-list">
        <li><b>인식의 전환</b> — 활동 중단이 개인의 실패가 아니라 참여 구조의 한계에서 비롯된 공통 과제임을 인지하는 변화</li>
        <li><b>참여의 재정의</b> — 전적인 헌신에서 삶의 방식에 맞춰 조절 가능한 부분적·선택적 참여로의 태도 변화</li>
        <li><b>조직의 자기 점검</b> — 온보딩, 역할 경계, 피드백 통로를 단체가 스스로 돌아볼 수 있는 기준 제공</li>
        <li><b>기록의 축적</b> — 흩어져 있던 이탈 경험이 비식별 아카이브로 남아 다음 활동가와 단체가 참고할 근거가 됨</li>
      </ul>
    </div>
  `;
}

function renderCrossView(){
  return `
    <div class="person-header">
      <div class="eyebrow">교차 분석</div>
      <h2>전체 교차 분석 요약</h2>
      <div class="meta-line">인터뷰 9건을 가로질러 발견한 패턴</div>
    </div>

    <div class="section">
      <h3>유형 · 갈등 유무 · 핵심 키워드</h3>
      <table class="cross-table">
        <thead><tr><th>인터뷰이</th><th>이탈 유형</th><th>갈등 유무</th><th>핵심 키워드</th></tr></thead>
        <tbody>
          ${crossRows.map(r=>`<tr><td class="name">${r.name}</td><td>${r.type}</td><td>${r.conflict}</td><td>${r.keyword}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="section">
      <h3>핵심 인사이트</h3>
      <ul class="finding-list">
        ${findings.map((f,i)=>`<li><span class="num">${i+1}</span><span>${f}</span></li>`).join('')}
      </ul>
    </div>

    <div class="section">
      <h3>이 아카이브에 대하여</h3>
      <div class="note-box">${cautionNote}</div>
    </div>
  `;
}

function renderContent(){
  const el = document.getElementById('content');
  if(state.view==='overview') el.innerHTML = renderOverviewView();
  else if(state.view==='person') el.innerHTML = renderPersonView();
  else el.innerHTML = renderCrossView();
}

function renderTabs(){
  document.querySelectorAll('.view-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.view===state.view);
  });
  document.getElementById('personNavWrap').classList.toggle('hidden', state.view!=='person');
}

function renderAll(){
  renderTabs();
  renderTagFilters();
  renderPersonList();
  renderContent();
}

/* ============ EVENTS ============ */
document.querySelectorAll('.view-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    state.view = t.dataset.view;
    renderAll();
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

document.getElementById('searchInput').addEventListener('input',(e)=>{
  state.query = e.target.value;
  renderAll();
});

renderAll();
</script>
</body>
</html>
