<script>
var Q=[
{id:'q1',t:"공익활동 관련 소식을 접했을 때, 당신의 첫 반응은?",o:[["'이건 꼭 해야 해!' 바로 달력에 메모하고 관련 자료를 검색한다.",'FP'],["'오, 재미있겠네.' 나중에 여유가 되면 참여할 목록에 추가한다.",'BP'],["'좋은 일 하는구나.' 속으로 응원하고 빠르게 스크롤을 내린다.",'BS'],["'이거 같이 하자!' 바로 주변 사람들에게 공유하고 같이 가자고 한다.",'FS']]},
{id:'q2',t:"누군가 갑자기 공익활동 참여를 제안했을 때, 당신의 태도는?",o:[["'좋아요! 구체적인 계획은 어떻게 되나요?' 바로 역할을 분담하고 추진한다.",'FP'],["'음... 시간이 되면.' 일단 스케줄을 확인하고, 내 부담이 적은지 따져본다.",'BP'],["'정말 대단하세요!' 상대를 칭찬하며 개인적인 호의를 베푼다.",'BS'],["'일단 해봐요!' 계획은 나중에 하고 먼저 시작해본다.",'FS']]},
{id:'q3',t:"활동에 참여하기로 결정했지만, 당일에 컨디션이 좋지 않다면?",o:[["미리 양해를 구하고 최대한 할 수 있는 만큼이라도 참여한다.",'FP'],["무리하지 않는 선에서 꼭 필요한 역할만 수행하고 빠르게 퇴장한다.",'BP'],["'오늘은 어쩔 수 없지.' 미안하다고 사과하고 다음 기회로 미룬다.",'BS'],["당일에 '못 가지만 이건 할게요'라고 다른 일을 즉석에서 제안한다.",'FS']]},
{id:'q8',t:"공익활동 중 예상치 못한 문제가 발생했을 때, 당신의 행동은?",o:[["앞장서서 해결책을 제시하고 주변을 독려한다.",'FS'],["도움을 줄 수 있는 사람을 찾아 연결하거나, 전문가에게 문의한다.",'FP'],["'내가 해결할 수 있는 문제가 아닌 것 같다'고 솔직히 말하고 빠진다.",'BS'],["문제가 정리될 때까지 지켜보다가, 정해지면 그때 맞춰 움직인다.",'BP']]},
{id:'sit',t:"주최 측이 단톡방에 '내일 행사 일손이 부족해요'라고 올렸다. 당신은?",o:[["'내일 가서 짐 나를게요.'",'M'],["'안내문 지금 만들어서 보낼게요.'",'H'],["'제 계정에 올려서 사람 모아볼게요.'",'T']]},
{id:'q4',t:"당신이 선호하는 공익활동 참여 방식은?",o:[["일회성 행사 지원 (ex: 물품 포장, 팝업 부스 운영)",'M'],["자신이 가진 전문 지식/기술을 활용한 재능 기부",'H'],["온라인 캠페인 참여 (ex: 서명 운동, SNS 공유)",'T']]},
{id:'q12',t:"다음 활동 유형 중, 당신이 부담 없이 '즐기면서' 참여할 수 있는 유형은?",o:[["특별한 준비 없이 몸만 가면 되는 단순 노동형 활동",'M'],["내가 만든 결과물이 남는 활동 (포스터, 번역, 영상 등)",'H'],["가볍게 시작할 수 있는 SNS 챌린지 또는 해시태그 운동",'T']]},
{id:'q7',t:"다음 중 당신의 '느슨함'의 정도를 가장 잘 나타내는 문항은?",o:[["나는 '느슨함'과는 거리가 먼, 열정적인 활동가다.",'FP'],["정기적으로 '숟가락만 얹는' 형태로 참여한다.",'BP'],["다른 사람의 요청이 있을 때 일시적으로 참여하는 편이다.",'BS'],["시작은 거창하지만 마무리는 흐지부지될 때가 많다.",'FS']]},
{id:'q10',multi:3,t:"당신의 '활동 지속력'에 가장 크게 영향을 미치는 요인 3가지를 선택해 주세요.",hint:"3개를 골라주세요.",o:[["함께하는 사람들의 친밀도","함께하는 사람들과 거리가 느껴지면"],["참여하는 활동의 난이도 및 복잡성","해야 할 일이 복잡해지면"],["내 개인 일정과의 충돌 여부","내 일정과 겹치기 시작하면"],["활동 후 주어지는 인정이나 보상 (ex: 감사 인사, 수료증)","한 일에 대한 인정이나 보상이 없으면"],["활동 목표 달성 여부","해도 목표에 가까워지는 게 보이지 않으면"],["내가 투입해야 하는 시간의 양","들어가는 시간이 늘어나면"]]},
{id:'q13',t:"공익활동에 대한 동기 부여를 위해 가장 효과적이라고 생각하는 방식은 무엇인가요?",o:[["재미있고 흥미로운 콘텐츠로 동기 부여","재미있어 보이는 소식을 만나면"],["명확하고 구체적인 활동 목표 제시","할 일과 끝나는 기준이 분명하면"],["활동의 사회적 중요성과 영향력 강조","이 일이 어떤 변화를 만드는지 보이면"],["참여자들의 진솔한 경험담 공유","같은 일을 해본 사람의 솔직한 경험담을 들으면"],["경제적 인센티브나 보상 제공","작은 보상이라도 따라오면"]]}
];
var T={
MPF:{n:'현장반장',s:'"접수대는 제가 볼게요."',d:'정해진 날 현장에서 일을 맡아 돌립니다. 접수, 동선, 인원 확인이 맡겨지면 알아서 정리됩니다.',tr:'다 맡다가 정작 그날 가장 지쳐 있습니다. 맡을 일을 하나로 정해두는 쪽이 오래 갑니다.',b:['행사 전날 동선을 머릿속으로 한 번 돕니다.','모르는 사람이 길을 물으면 자기 일처럼 안내합니다.','일이 끝나면 인원을 한 번 더 셉니다.'],sh:['접수대나 입구에 사람이 몰릴 때','역할이 정해지지 않아 다들 서성일 때'],dr:'맡긴 일의 범위가 끝없이 늘어날 때',f:[['마실',3,'공지된 일정에서 앞을 맡을 수 있습니다.'],['사이',2,'호스트로 날짜를 정할 때 맞습니다.'],['글벗',1,'현장에서 일을 돌리는 힘을 쓸 곳이 없습니다.']]},
MPB:{n:'뒷정리 담당',s:'"의자는 제가 접을게요."',d:'정해진 날 가서 눈에 띄지 않는 일을 맡습니다. 행사가 끝난 뒤 남은 일을 먼저 봅니다.',tr:'일이 보여서 계속 하게 됩니다. 끝나는 시간을 먼저 정해두는 쪽이 맞습니다.',b:['행사가 끝나면 가장 먼저 남은 물건을 봅니다.','박수 칠 때 이미 의자를 접고 있습니다.','맡은 적 없는 일도 눈에 띄면 합니다.'],sh:['행사가 끝나고 다들 흩어질 때','뒷정리 담당이 따로 없는 현장'],dr:'정리를 도와주는 사람이 없는 일이 반복될 때',f:[['마실',3,'일정이 있고 뒤에서 거들 수 있습니다.'],['사이',2,'호스트가 아니라 참석자일 때 맞습니다.'],['글벗',1,'뒤에서 거들 현장이 없습니다.']]},
MSF:{n:'번개 주최',s:'"오늘 저녁에 가실 분?"',d:'생각나면 날짜를 잡고 사람을 부릅니다. 일정은 즉흥이지만 모이게 하는 힘이 있습니다.',tr:'모임이 한 번으로 끝나기 쉽습니다. 다음 날짜를 그 자리에서 정해두면 이어집니다.',b:['장소를 정하기 전에 먼저 모읍니다.','세 명이 모이면 일이 시작된 걸로 칩니다.','모임이 끝나면 다음 일정을 잊습니다.'],sh:['단톡방에서 다들 말이 없을 때','갑자기 저녁 시간이 비었을 때'],dr:'공지, 장소 예약, 정산을 혼자 할 때',f:[['사이',3,'정해진 일정 없이 호스트로 열 수 있습니다.'],['마실',2,'공지된 일정에 맞추면 즉흥성이 줄어듭니다.'],['글벗',1,'사람을 모으는 힘을 쓸 곳이 없습니다.']]},
MSB:{n:'일손 지원단',s:'"필요하면 불러주세요."',d:'부르면 가서 거듭니다. 계획에는 없어도 연락이 오면 시간을 냅니다.',tr:'부르는 사람이 없으면 아무 일도 일어나지 않습니다. 불러달라고 먼저 말해두는 쪽이 맞습니다.',b:['연락이 오면 일정부터 열어봅니다.','무슨 일인지 묻기 전에 일단 가겠다고 합니다.','맡은 자리에서 시키는 대로 정확히 움직입니다.'],sh:['갑자기 일손이 모자랄 때','짐 나르기처럼 하면 바로 끝나는 일'],dr:'몇 시간 일하고도 무슨 행사였는지 모를 때',f:[['사이',3,'부르면 가는 모임이 맞습니다.'],['마실',2,'참석을 직전에 정할 수 있는 일정만 맞습니다.'],['글벗',1,'부를 사람이 없는 편지입니다.']]},
HPF:{n:'프로젝트 담당',s:'"일정표 만들었어요."',d:'마감과 역할을 정하고 결과물을 끌고 갑니다. 일정표가 있어야 진행이 됩니다.',tr:'일정표를 만드는 사람이 가장 바빠집니다. 전부 쥐지 말고 마감 하나만 쥐는 쪽이 맞습니다.',b:['시작하기 전에 일정표부터 만듭니다.',"회의 끝에 '그래서 누가 언제까지'를 묻습니다.",'공유 문서의 파일 이름 규칙부터 정합니다.'],sh:['역할과 마감이 흐릿해 다들 눈치를 볼 때','여러 결과물을 한 곳에 모아야 할 때'],dr:'정해둔 일정이 계속 밀릴 때',f:[['마실',3,'행사 기획과 제작을 앞에서 맡을 수 있습니다.'],['사이',2,'호스트 가이드를 만들 때 맞습니다.'],['글벗',1,'일정표를 쓸 곳이 없습니다.']]},
HPB:{n:'마감 장인',s:'"금요일까지 보내드릴게요."',d:'정해진 마감에 맞춰 결과물을 만듭니다. 앞에 나서기보다 뒤에서 완성도를 책임집니다.',tr:'마감이 있는 일은 끝까지 하지만, 마감이 없는 요청은 계속 뒤로 밀립니다. 요청을 받으면 마감부터 물어보는 쪽이 맞습니다.',b:['마감 하루 전에 거의 끝나 있습니다.','요청을 받으면 파일 형식과 분량부터 확인합니다.','작업하는 동안에는 연락이 줄어듭니다.'],sh:['마감과 결과물 기준이 분명한 요청','앞에서 일정을 정해주는 사람이 있을 때'],dr:"마감 없이 '언제든 괜찮아요' 하고 부탁받을 때",f:[['글벗',3,'주기가 없어 마감에 쫓기지 않고, 편지가 결과물로 남습니다.'],['마실',2,'포스터, 안내문 같은 사전 제작일 때 맞습니다.'],['사이',1,'마감을 걸 곳이 없습니다.']]},
HSF:{n:'즉석 제작자',s:'"방금 하나 만들어봤어요."',d:'생각나면 바로 만들어서 올립니다. 시작이 빠르고, 만들어 놓은 뒤에 알립니다.',tr:'만든 것이 쓰일 곳이 없을 수 있습니다. 만들기 전에 필요한 사람이 있는지 한 줄만 묻는 쪽이 맞습니다.',b:['아이디어가 나오면 그날 밤에 시안이 나옵니다.','쓰일지 정해지기 전에 일단 만들어봅니다.','만든 것을 올릴 때 설명은 한 줄입니다.'],sh:['회의에서 말만 오가고 보여줄 것이 없을 때','급하게 포스터나 문구가 필요할 때'],dr:'만든 것이 아무 데도 쓰이지 않은 채 쌓일 때',f:[['글벗',3,'주기 없이 즉흥으로 쓴 편지가 맞습니다.'],['사이',2,'모임에 가져갈 것을 즉석에서 만들 때 맞습니다.'],['마실',2,'공지된 일정에 맞춰 만들 때 맞습니다.']]},
HSB:{n:'조용한 수정자',s:'"오타 고쳐놨어요."',d:'눈에 띄지 않게 고쳐 둡니다. 오타, 간격, 빠진 링크처럼 아무도 말하지 않는 부분을 찾아냅니다.',tr:'고쳤다는 걸 아무도 모릅니다. 한 줄만 남겨두면 기여가 기록으로 남습니다.',b:['문서를 열면 오타부터 보입니다.','고친 사실은 말하지 않습니다.','수정 기록에서만 이름이 보입니다.'],sh:['공개 직전 문서를 다시 읽어볼 때','링크가 깨졌는데 아무도 말하지 않을 때'],dr:'같은 오류를 몇 번이고 고쳐야 할 때',f:[['글벗',3,'답장 시점이 없고 혼자 조용히 할 수 있습니다.'],['사이',2,'모임 안내문을 손봐줄 때 맞습니다.'],['마실',1,'현장에서 쓸 일이 적습니다.']]},
TPF:{n:'소식지 편집장',s:'"이번 호 올립니다."',d:'정해진 주기로 소식을 정리해서 알립니다. 흩어진 소식을 한 곳에 모읍니다.',tr:'주기를 지키는 부담이 혼자 쌓입니다. 격주나 월 1회로 낮춰서 시작하는 쪽이 오래 갑니다.',b:['소식을 모으는 요일이 정해져 있습니다.','흩어진 공지를 한 장으로 정리합니다.','제목을 몇 번이고 고쳐 씁니다.'],sh:['소식이 여러 곳에 흩어져 있을 때','같은 공지가 세 곳에 따로 올라올 때'],dr:'발행일이 다가오는데 보낼 소식이 없을 때',f:[['마실',3,'일정 소식을 정리해 알릴 수 있습니다.'],['사이',2,'호스트 소식을 모아 알릴 때 맞습니다.'],['글벗',2,'주기를 정하면 부담이 됩니다.']]},
TPB:{n:'정기 구독자',s:'"새 소식 읽었어요."',d:'정해진 때에 소식을 읽고 반응합니다. 직접 나서진 않지만 소식을 놓치지 않습니다.',tr:'읽기만 하는 상태가 길어지면 소식이 쌓입니다. 한 줄 반응을 습관으로 두는 쪽이 맞습니다.',b:['알림을 켜두고 정해진 시간에 확인합니다.','읽었다는 표시를 꼭 남깁니다.','참여는 안 해도 소식은 놓치지 않습니다.'],sh:['소식이 일정한 주기로 올 때','읽기만 해도 되는 소식이 있을 때'],dr:'소식이 불규칙해지고 양이 갑자기 늘 때',f:[['글벗',3,'주기 없이 받은 편지를 읽을 수 있습니다.'],['마실',2,'공지를 보고 갈 일정만 고르면 맞습니다.'],['사이',1,'정해진 일정이 없어 읽을 소식이 없습니다.']]},
TSF:{n:'공유 담당',s:'"이거 퍼뜨릴게요."',d:'보이는 대로 알립니다. 사람을 모으는 일도 직접 일하는 것만큼 큰 기여입니다.',tr:'알리는 것으로 끝나기 쉽습니다. 공유할 때 날짜와 링크를 같이 붙이는 쪽이 맞습니다.',b:['좋은 소식을 보면 바로 단톡방에 올립니다.','공유할 때 한 줄 평을 붙입니다.','끝까지 읽기 전에 먼저 보냅니다.'],sh:['모집 마감이 얼마 안 남았을 때','아직 모르는 사람이 많은 소식'],dr:'공유했는데 반응이 하나도 없을 때',f:[['마실',3,'행사를 알리고 같이 가자고 할 수 있습니다.'],['사이',2,'모임 소식을 퍼뜨릴 때 맞습니다.'],['글벗',1,'퍼뜨릴 대상이 한 사람뿐입니다.']]},
TSB:{n:'지켜보는 사람',s:'"읽고 있어요."',d:'반응은 적어도 계속 읽고 있습니다. 필요한 때 한 번 움직일 수 있는 상태를 유지합니다.',tr:'움직일 때를 놓칩니다. 한 줄 답장을 먼저 정해두면 시작이 쉬워집니다.',b:['소식은 읽지만 반응은 속으로 합니다.','저장해두고 나중에 다시 봅니다.','필요한 순간에는 조용히 한 번 움직입니다.'],sh:['모두가 놓친 소식을 혼자 알고 있을 때','지켜보다가 딱 한 번 움직일 만한 일이 올 때'],dr:'반응하라는 연락이 계속 쌓일 때',f:[['글벗',3,'답장 시점이 정해져 있지 않습니다.'],['사이',2,'참석만 하는 방식이면 맞습니다.'],['마실',1,'공지가 반복되면 불참이 쌓입니다.']]}
};
var MN={M:'몸',H:'손',T:'말'},RN={P:'계획',S:'즉흥'},PN={F:'앞',B:'뒤'};
var $=function(i){return document.getElementById(i)};
var cur=0,ans={},order={},sel=[];
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function calc(an){ // an: id -> option index (multi: array)
 var c={M:0,H:0,T:0,F:0,B:0,P:0,S:0};
 Q.forEach(function(q){var a=an[q.id];if(a==null||q.multi||!/^[A-Z]+$/.test(q.o[0][1]))return;var g=q.o[a][1];
  if(g.length==1)c[g]++;else{c[g[0]]++;c[g[1]]++}});
 var mx=Math.max(c.M,c.H,c.T),tie=['M','H','T'].filter(function(k){return c[k]==mx});
 var q4=Q.filter(function(q){return q.id=='q4'})[0],m=tie.length>1?q4.o[an.q4][1]:tie[0];
 if(tie.length>1&&tie.indexOf(m)<0)m=tie[0];
 var p=c.F>c.B?'F':'B',r=c.P>c.S?'P':'S';
 return {c:c,key:m+r+p,m:m,r:r,p:p};
}
window.__calc=calc;window.__Q=Q;
function show(){
 var q=Q[cur];$('pg').textContent=(cur+1)+' / '+Q.length;$('qt').textContent=q.t;$('hint').textContent=q.hint||'';
 if(!order[q.id])order[q.id]=shuf(q.o.map(function(_,i){return i}));
 var h='';order[q.id].forEach(function(k){var on=q.multi?sel.indexOf(k)>=0:ans[q.id]===k;h+='<button class="opt'+(on?' on':'')+'" data-k="'+k+'">'+q.o[k][0]+'</button>'});
 $('ops').innerHTML=h;$('prev').disabled=cur===0;$('next').hidden=!q.multi;$('next').disabled=sel.length<(q.multi||0);
 Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){var q=Q[cur];
 if(q.multi){var i=sel.indexOf(k);if(i>=0)sel.splice(i,1);else if(sel.length<q.multi)sel.push(k);ans[q.id]=sel.slice();show();return}
